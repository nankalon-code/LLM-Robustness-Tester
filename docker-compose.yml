version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: llm_robustness_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm_robustness_backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_HOST=http://ollama:11434
      - DEFAULT_MODEL=llama3.1:8b
      - DATABASE_URL=sqlite:///./llm_robustness.db
    depends_on:
      - ollama

volumes:
  ollama_storage:
